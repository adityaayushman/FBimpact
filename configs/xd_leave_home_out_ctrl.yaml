# Realistic-data protocol: train on UR Fall + Le2i Coffee room, test on Le2i Home.  Arm: xyv control.
#
# No test clip shares a dataset (or, for the leave-scene-out protocols, a room and
# camera) with any training clip, so this measures transfer to a place the model
# has never seen. It is a harder and more honest question than a random split
# inside one dataset. Single split, so run with --folds 0.

_base_: combined_xyv.yaml

run:
  name: xd_leave_home_out_ctrl

data:
  split:
    mode: holdout
    val_fraction: 0.25
    seed: 0
    test:
      source: le2i
      scene: home
