# Render blueprint for the inference API.
#
# The service root is the repository root, not backend/, because the API imports
# the project's own packages (data/, models/, evaluation/, explain/) rather than
# reimplementing them. Running the demo through the same code as eval.py is what
# keeps the two from drifting apart.
#
# Deploy: push to GitHub, then New > Blueprint on render.com and point it here.

services:
  - type: web
    name: fbimpact-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      # One worker, one thread. The free tier is a fraction of a shared CPU, and
      # a 393k-parameter model spends more time on thread coordination than on
      # arithmetic if you let torch spin up a pool.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      # Set this to the Vercel domain once the frontend is deployed. Until then
      # the app falls back to allowing *.vercel.app, which is convenient for
      # preview deployments and too permissive for anything else.
      - key: ALLOWED_ORIGINS
        sync: false
