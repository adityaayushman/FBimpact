[pytest]
testpaths = tests
python_files = test_*.py

# pytest's tmp_path/tmpdir fixtures default to the system temp directory, which
# on this machine is on C:. Tests that round-trip a cached clip were therefore
# writing skeleton .npz files to C: on every run, despite the project living
# entirely on D:. Pinning basetemp keeps every artefact this repo produces on
# the same drive as the repo.
#
# pytest prunes all but the last few basetemp directories itself, so this does
# not accumulate.
addopts = --basetemp=d:/tmp/pytest

filterwarnings =
    # torch emits this on Windows whenever CUDA allocator config is set; it is
    # informational and drowns the actual test output.
    ignore:expandable_segments not supported:UserWarning
